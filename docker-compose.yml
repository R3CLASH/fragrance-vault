# One-command setup: PostgreSQL + Strapi CMS + Next.js storefront.
#   1. cp cms/.env.example cms/.env   (then set secrets: node cms/scripts/generate-secrets.js)
#   2. docker compose up -d --build
#   3. Open http://localhost:1337/admin to create your admin login, and http://localhost:3000 for the shop.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fragrancevault}
      POSTGRES_USER: ${DATABASE_USERNAME:-fragrancevault}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-fragrancevault}"], interval: 5s, retries: 10 }

  cms:
    build: ./cms
    restart: unless-stopped
    env_file: ./cms/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-fragrancevault}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-fragrancevault}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    depends_on: { db: { condition: service_healthy } }
    ports: ["1337:1337"]
    volumes: [uploads:/app/public/uploads]

  web:
    build:
      context: ./web
      args: { STRAPI_URL: "http://cms:1337", NEXT_PUBLIC_SITE_URL: "${SITE_URL:-http://localhost:3000}" }
    restart: unless-stopped
    environment:
      STRAPI_URL: http://cms:1337
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
    depends_on: [cms]
    ports: ["3000:3000"]

volumes:
  db-data:
  uploads:
